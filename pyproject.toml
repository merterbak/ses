[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ses"
version = "0.0.1"
description = "Ollama for voice: pull, hot-swap and serve local speech models (TTS + STT) on any machine, fully offline."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mert Erbak" }]
keywords = [
    "tts",
    "stt",
    "whisper",
    "whisper.cpp",
    "vosk",
    "chatterbox",
    "kokoro",
    "onnx",
    "voice",
    "speech",
    "windows",
    "mlx",
    "local",
    "offline",
    "ollama",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "huggingface-hub>=0.23",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "python-multipart>=0.0.9",
    "piper-tts>=1.6",
    "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "faster-whisper>=1.1 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
onnx-asr = ["onnx-asr>=0.12"]
mlx-audio = ["mlx-audio>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'"]
whisper-cpp = ["pywhispercpp>=1.5"]
vosk = [
    "vosk==0.3.44 ; sys_platform == 'darwin'",
    "vosk>=0.3.45 ; sys_platform != 'darwin'",
]
chatterbox = [
    "chatterbox-tts>=0.1.7,<0.2",
    "setuptools<81",
]
vad = ["silero-vad>=6.0"]
transformers = ["transformers>=4.44", "torch>=2.1"]
kokoro = ["kokoro-onnx>=0.5,<0.6"]
default = ["ses[whisper-cpp,vosk,chatterbox,vad]"]

[project.urls]
Homepage = "https://github.com/merterbak/ses"
Issues = "https://github.com/merterbak/ses/issues"

[project.scripts]
ses = "ses.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ses"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.isort]
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]
